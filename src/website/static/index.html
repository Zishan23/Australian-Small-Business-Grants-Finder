<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AU Small Business Grants Finder (demo)</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #2b2a27;
    --muted: #706c64;
    --accent: #b5651d;
    --accent-dark: #8f4f16;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 20px 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .banner {
    max-width: 720px;
    margin: 0 auto 12px;
    padding: 10px 14px;
    background: #fbeee0;
    border: 1px solid #ead2b3;
    border-radius: 8px;
    color: #6b4a1c;
    font-size: 0.85rem;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }
  #chat {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 16px;
  }
  .msg {
    padding: 12px 14px;
    border-radius: 10px;
    line-height: 1.45;
    font-size: 0.95rem;
  }
  .msg.user {
    background: #2b2a27;
    color: #fff;
    align-self: flex-end;
    max-width: 85%;
  }
  .msg.bot {
    background: var(--card);
    border: 1px solid var(--border);
    align-self: flex-start;
    max-width: 100%;
  }
  .mock-tag {
    display: inline-block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: #fbeee0;
    color: #8f4f16;
    padding: 2px 6px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .citations {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
  }
  .citations a {
    color: var(--accent-dark);
    text-decoration: none;
  }
  .citations a:hover { text-decoration: underline; }
  .agents-used {
    margin-top: 6px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .examples {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .examples button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 0.8rem;
    padding: 6px 10px;
  }
  .examples button:hover { background: #f0efeb; }
</style>
</head>
<body>
<header>
  <h1>AU Small Business Grants Finder</h1>
  <p>Ask about grants you may be eligible for, or compliance obligations (tax, pay rates, awards).</p>
</header>
<div class="banner">
  This is a local demo. Answers are currently generated by a mock backend until the
  real retrieval + Bedrock pipeline is deployed — every response says so.
</div>
<main>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="e.g. What grants am I eligible for as a hospitality business in Victoria?" autocomplete="off" />
    <button id="submit" type="submit">Ask</button>
  </form>
  <div class="examples">
    <button data-q="What grants am I eligible for as a hospitality business in Victoria with 4 employees?">Grant example</button>
    <button data-q="What are my superannuation obligations as a small employer?">Tax/compliance example</button>
    <button data-q="What is the minimum pay rate for a casual retail employee?">Award pay example</button>
  </div>
</main>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const submitBtn = document.getElementById("submit");

  function addMessage(role, html) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = html;
    chat.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function ask(question) {
    addMessage("user", escapeHtml(question));
    submitBtn.disabled = true;
    try {
      const res = await fetch("/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) throw new Error("Request failed: " + res.status);
      const data = await res.json();

      let html = "";
      if (data.is_mock) html += '<span class="mock-tag">Demo answer</span><br/>';
      html += escapeHtml(data.answer).replace(/\n/g, "<br/>");

      if (data.citations && data.citations.length) {
        html += '<div class="citations"><strong>Sources:</strong><ul style="margin:6px 0 0 18px; padding:0;">';
        for (const c of data.citations) {
          html += `<li><a href="${c.url}" target="_blank" rel="noopener">${escapeHtml(c.title)}</a> (${escapeHtml(c.source)})</li>`;
        }
        html += "</ul></div>";
      }
      if (data.agents_used && data.agents_used.length) {
        html += `<div class="agents-used">Agents used: ${data.agents_used.map(escapeHtml).join(", ")}</div>`;
      }
      addMessage("bot", html);
    } catch (err) {
      addMessage("bot", "Something went wrong talking to the backend: " + escapeHtml(err.message));
    } finally {
      submitBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    ask(q);
  });

  document.querySelectorAll(".examples button").forEach((btn) => {
    btn.addEventListener("click", () => ask(btn.dataset.q));
  });
</script>
</body>
</html>
