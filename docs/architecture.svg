<svg viewBox="0 0 1240 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
  <text x="620" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">AU Small Business Grants Finder — Architecture</text>

  <!-- Data sources lane -->
  <text x="30" y="80" font-size="14" font-weight="700" fill="#334155">Data sources</text>
  <g font-size="12" fill="#0f172a">
    <rect x="30" y="90" width="150" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="105" y="120" text-anchor="middle">GrantConnect (API)</text>

    <rect x="200" y="90" width="150" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="275" y="112" text-anchor="middle">data.gov.au</text>
    <text x="275" y="128" text-anchor="middle">(CKAN API)</text>

    <rect x="370" y="90" width="150" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="445" y="112" text-anchor="middle">business.gov.au</text>
    <text x="445" y="128" text-anchor="middle">(scrape)</text>

    <rect x="540" y="90" width="150" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="615" y="112" text-anchor="middle">ATO guidance</text>
    <text x="615" y="128" text-anchor="middle">(scrape)</text>

    <rect x="710" y="90" width="170" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="795" y="112" text-anchor="middle">Fair Work MAPD</text>
    <text x="795" y="128" text-anchor="middle">(scrape + PDF)</text>
  </g>

  <!-- Trigger -->
  <rect x="960" y="90" width="240" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="1080" y="112" text-anchor="middle" font-size="12">EventBridge Scheduler</text>
  <text x="1080" y="128" text-anchor="middle" font-size="12">weekly trigger</text>

  <!-- arrows from trigger and sources to fargate -->
  <line x1="1080" y1="140" x2="500" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="105" y1="140" x2="440" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="275" y1="140" x2="450" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="140" x2="460" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="140" x2="480" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="140" x2="500" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ECS Fargate ingestion -->
  <rect x="360" y="200" width="240" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="480" y="226" text-anchor="middle" font-size="13" font-weight="600">ECS Fargate</text>
  <text x="480" y="244" text-anchor="middle" font-size="12">weekly ingestion task</text>

  <!-- to S3 raw -->
  <line x1="480" y1="260" x2="480" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="320" width="240" height="55" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="480" y="344" text-anchor="middle" font-size="13" font-weight="600">S3 — raw zone</text>
  <text x="480" y="362" text-anchor="middle" font-size="11">raw/{source}/{date}/</text>

  <!-- SNS alert branch -->
  <line x1="600" y1="230" x2="880" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="880" y="200" width="180" height="55" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="970" y="224" text-anchor="middle" font-size="12" font-weight="600">SNS</text>
  <text x="970" y="242" text-anchor="middle" font-size="11">failure alert on any stage</text>

  <!-- S3 raw to SQS -->
  <line x1="480" y1="375" x2="480" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="430" width="200" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="480" y="460" text-anchor="middle" font-size="13" font-weight="600">SQS queue</text>

  <!-- SQS to processing lambda -->
  <line x1="480" y1="480" x2="480" y2="530" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="530" width="240" height="55" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="480" y="554" text-anchor="middle" font-size="13" font-weight="600">Lambda</text>
  <text x="480" y="572" text-anchor="middle" font-size="11">clean, normalize, chunk</text>

  <!-- Lambda to processed store -->
  <line x1="480" y1="585" x2="480" y2="640" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="640" width="150" height="55" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="405" y="663" text-anchor="middle" font-size="12" font-weight="600">S3 — processed</text>
  <text x="405" y="680" text-anchor="middle" font-size="11">embeddings</text>

  <rect x="500" y="640" width="150" height="55" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="575" y="663" text-anchor="middle" font-size="12" font-weight="600">DynamoDB</text>
  <text x="575" y="680" text-anchor="middle" font-size="11">structured records</text>

  <!-- to RAG layer -->
  <line x1="405" y1="695" x2="500" y2="750" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="695" x2="530" y2="750" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="750" width="360" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="510" y="774" text-anchor="middle" font-size="13" font-weight="600">Bedrock + multi agent orchestrator</text>
  <text x="510" y="792" text-anchor="middle" font-size="11">eligibility agent · compliance agent · retrieval agent</text>
  <text x="510" y="808" text-anchor="middle" font-size="11">generates answer with source citations</text>

  <!-- user query -->
  <rect x="750" y="750" width="180" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="840" y="778" text-anchor="middle" font-size="12" font-weight="600">User query</text>
  <text x="840" y="796" text-anchor="middle" font-size="11">e.g. "grants for a</text>
  <text x="840" y="810" text-anchor="middle" font-size="11">hospitality business in VIC"</text>
  <line x1="750" y1="790" x2="690" y2="790" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EKS demo box, separate, dashed -->
  <rect x="980" y="640" width="230" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="1095" y="664" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">EKS — one time demo</text>
  <text x="1095" y="682" text-anchor="middle" font-size="11" fill="#64748b">deployed and torn down</text>
  <text x="1095" y="698" text-anchor="middle" font-size="11" fill="#64748b">same day</text>
  <text x="1095" y="716" text-anchor="middle" font-size="10" fill="#94a3b8">not part of live system</text>

  <!-- Legend -->
  <g font-size="11" fill="#475569">
    <rect x="30" y="850" width="14" height="14" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="50" y="861">Data / API layer</text>
    <rect x="180" y="850" width="14" height="14" fill="#fee2e2" stroke="#dc2626"/>
    <text x="200" y="861">Compute</text>
    <rect x="290" y="850" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="310" y="861">Storage</text>
    <rect x="390" y="850" width="14" height="14" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="410" y="861">Queue</text>
    <rect x="480" y="850" width="14" height="14" fill="#fce7f3" stroke="#db2777"/>
    <text x="500" y="861">Alerting</text>
    <rect x="580" y="850" width="14" height="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3 2"/>
    <text x="600" y="861">One time demo only</text>
  </g>
</svg>
